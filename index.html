
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>درس دلالة المصباح السنة الأولى متوسط قناة زينة التعليمية</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Lalezar&display=swap">
<style>
:root{--card:#fffdf3;--ink:#1c3a5e;--ink2:#4d6a8a;--line:#cfe0f5;--leaf:#2f9bf0;--leafd:#1560b0;--woodd:#6f4120;--sun:#ffc531;--good:#d9f7df;--bad:#ffe0d2;--s1:#6fc3ff;--s2:#d6efff;--s3:#fff3c9;--sh:rgba(20,60,110,.3);--fd:'Lalezar','Baloo Bhaijaan 2',sans-serif;--fb:'Baloo Bhaijaan 2',Tahoma,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--card:#14233a;--ink:#e6f1ff;--ink2:#9fb9d8;--line:#2a4a72;--good:#17482c;--bad:#5a2a1c;--s1:#0b1f3a;--s2:#10294a;--s3:#1a2a3c;--sh:rgba(0,0,0,.5)}}
:root[data-theme=dark]{--card:#14233a;--ink:#e6f1ff;--ink2:#9fb9d8;--line:#2a4a72;--good:#17482c;--bad:#5a2a1c;--s1:#0b1f3a;--s2:#10294a;--s3:#1a2a3c;--sh:rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:17px/1.7 var(--fb);color:var(--ink);background:linear-gradient(var(--s1),var(--s2) 50%,var(--s3)) fixed;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}img{max-width:100%;display:block}
#app{max-width:900px;margin:auto;padding:14px 14px 60px}
.sign{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:26px;background:repeating-linear-gradient(90deg,#b97b46 0 38px,#a96d3b 38px 40px);box-shadow:0 8px 0 var(--woodd),0 18px 24px var(--sh);margin-top:12px}
.brand{display:flex;align-items:center;gap:12px}.bi{width:70px;height:70px;border-radius:50%;background:radial-gradient(#4aa8ff,#1560b0);border:4px solid #fff;padding:4px;animation:pl 2s ease-in-out infinite alternate}@keyframes pl{to{box-shadow:0 0 22px #ffe27a}}.lg{width:44px;height:44px;border-radius:50%;border:3px solid #fff}
h1{margin:0;font:400 clamp(28px,7vw,46px)/1.2 var(--fd);color:var(--sun);text-shadow:2px 2px 0 var(--woodd),4px 4px 0 var(--woodd)}
.brand small{display:block;color:#fff;font-weight:600}
.yt{padding:8px 18px;border-radius:16px;background:linear-gradient(#ff6370,#ff3040);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 5px 0 #a8081a}
.pn{background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line),0 14px 20px var(--sh);padding:16px;margin:18px 0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{flex:1;min-width:120px;height:16px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(#7fd0ff,var(--leaf));transition:width .5s}
.sm{padding:4px 14px;border-radius:99px;border:3px solid var(--line);background:var(--card)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tab{padding:10px 6px;border-radius:18px;border:0;font-weight:800;background:linear-gradient(#fffbe8,#f3e6bf);color:#4a2e14;box-shadow:0 6px 0 var(--woodd);position:relative}
.tab:active{transform:translateY(4px)}.tab.on{outline:4px solid var(--leaf)}.tab:disabled{filter:grayscale(1);opacity:.55}.tab b{display:block;font-size:26px}
h2{font:400 28px var(--fd);margin:4px 0 8px;color:var(--leafd)}
.pic{border-radius:18px;margin:8px auto;box-shadow:0 5px 0 var(--line);max-height:420px;object-fit:contain}
.q{margin:14px 0;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.q p{margin:0 0 8px;font-weight:800}.opts{display:grid;gap:8px}
.o{padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);text-align:right;box-shadow:0 4px 0 var(--line)}
.o.ok{background:var(--good);border-color:#34b35a}.o.no{background:var(--bad);border-color:#e0704a;animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.hint{margin-top:6px;color:#c0501f;font-weight:600}.say{margin-top:6px;font-weight:800;color:#1a8a3f}
.btn{padding:10px 22px;border-radius:16px;border:0;background:linear-gradient(#5db6ff,#2a86e0);color:#fff;font-weight:800;box-shadow:0 5px 0 #1560b0}.btn:disabled{opacity:.5}
.joke{display:none;margin:8px 0;padding:8px 14px;border-radius:20px;background:#fff;color:#333;box-shadow:0 3px 8px #0003;width:fit-content}
.lab{display:grid;gap:10px}.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pick b{min-width:110px}
.chip{padding:6px 16px;border-radius:99px;border:3px solid var(--line);background:var(--card);font-weight:800}.chip.on{background:var(--leaf);color:#fff;border-color:var(--leafd)}
svg.c{width:100%;max-width:560px;margin:auto;display:block;background:linear-gradient(#e9f4ff,#fff8e0);border-radius:20px}
.st{text-align:center;font:400 24px var(--fd);min-height:40px;margin:6px 0}.seen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seen span{padding:4px 12px;border-radius:99px;background:var(--line);opacity:.6;font-weight:800}.seen span.on{background:var(--good);opacity:1}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb td,.tb th{border:2px solid var(--line);padding:6px}.tb th{background:var(--leaf);color:#fff}
.stars{font-size:46px;text-align:center}.fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}.fx i{position:absolute;top:-40px;font-style:normal;font-size:30px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.glow{animation:gl .15s infinite alternate}@keyframes gl{to{opacity:.8}}
.smoke{animation:up 2s ease-out forwards}@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
.qh{display:flex;gap:10px;align-items:center;margin-bottom:6px}.qi{flex:none;font-size:30px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--c,#2f9bf0);box-shadow:0 4px 0 #0003}.qh p{margin:0;font-weight:800}.q{border-right:8px solid var(--c,#2f9bf0)}
.cw{margin:6px 0}.cs{text-align:center;font-weight:800;min-height:28px}.hd2{text-align:center;font-size:14px;color:var(--ink2)}.sw{cursor:pointer}.flow{stroke-dasharray:9 6;animation:fw .5s linear infinite}@keyframes fw{to{stroke-dashoffset:-15}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.nb{padding:12px 20px;border-radius:18px;border:0;font-weight:800;background:var(--card);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}.nx2{flex:1;max-width:260px;background:linear-gradient(#ffd45a,#f0a000);color:#4a2e14;border-color:#c98400;box-shadow:0 6px 0 #8a5a00;font-size:19px}.nx2 span{font-size:24px}.nx2.rdy{animation:bn .8s ease-in-out infinite alternate}@keyframes bn{to{transform:translateY(-6px)}}.nb:active{transform:translateY(4px)}.ms{margin:8px 0;padding:8px 12px;border-radius:14px;background:var(--card);border-right:6px solid var(--c)}.mt{color:var(--c);display:block}#mc .mt{display:inline}</style></head><body><div id="app">

h+=`<div class="nav" id="nav">${i>0?`<button class="nb" onclick="go(${i-1})">▶ السابق</button>`:'<span></span>'}${i<total-1?`<button class="nb nx2" id="nb" onclick="go(${i+1})"><span>⏭️</span> الدرس التالي</button>`:'<span></span>'}</div>`;$('#stage').innerHTML=h;if(a.lab)upd();scrollTo({top:0,behavior:'smooth'})}
const okc={};function ans(i,k,j,b){const q=ACT[i].qs[k],box=$('#q'+k);if(box.dataset.d)return;
if(j==q.a){b.classList.add('ok');box.dataset.d=1;box.querySelector('.hint').textContent='';box.querySelector('.say').textContent='🎉 انت بتذاكر منورانا هه';good();okc[i]=(okc[i]||0)+1;
if(okc[i]==ACT[i].qs.length){finish(i)}}else{b.classList.add('no');b.disabled=true;box.querySelector('.hint').textContent='💡 تلميح: '+q.h;bad()}}
function joke(){const j=$('#jk');j.style.display='block';pop();setTimeout(()=>j.style.display='none',4000)}
function finish(i){done.add(i);tabs();burst();$('#nx').innerHTML='<b>أحسنت! ⭐ أكملت هذا النشاط</b>';nv()}
function nv(){const b=$('#nb');if(b)b.classList.add('rdy')}
function burst(){const f=$('#fx');'⭐🎉✨🌟💡'.match(/./gu).concat(['⭐','🎉','✨','🌟','💡']).forEach((e,n)=>{for(let k=0;k<5;k++){const s=document.createElement('i');s.textContent=e;s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.8+'s';f.appendChild(s);setTimeout(()=>s.remove(),3800)}})}
/* sounds+circuit */
let H=null;function stopHum(){if(H){try{H.g.gain.exponentialRampToValueAtTime(.0005,AC.currentTime+.1);H.o.forEach(o=>o.stop(AC.currentTime+.15))}catch(e){}H=null}}
function hum(v){stopHum();if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const g=AC.createGain();g.gain.value=v;g.connect(AC.destination);const o=[100,200,400].map((f,i)=>{const x=AC.createOscillator();x.type=i?'sine':'sawtooth';x.frequency.value=f*(i?1:1);const gg=AC.createGain();gg.gain.value=i?.5:1;x.connect(gg);gg.connect(g);x.start();return x});H={g,o};setTimeout(()=>{if(H&&H.g===g)stopHum()},2500)}catch(e){}}
function clk(){tone(1400,.04,'square',.12);tone(600,.07,'square',.1,.05)}
function burnS(){stopHum();if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const n=AC.sampleRate*.9,bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.04?1:.25)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=bf;const g=AC.createGain();g.gain.value=.5;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}tone(2000,.35,'sawtooth',.08);tone(90,.5,'square',.1,.2)}
const S={};
function circ(p,L,B){S[p]={on:0,L,B};return `<svg class="c" viewBox="0 0 400 200"><rect x="30" y="80" width="90" height="50" rx="8" fill="#222"/><rect x="30" y="80" width="30" height="50" rx="8" fill="#e8a530"/><text x="42" y="112" fill="#222" font-size="20" font-weight="800" text-anchor="middle">+</text><text x="90" y="112" fill="#fff" font-size="20" text-anchor="middle" font-weight="800">${B}V</text>
<g fill="none" stroke="#d22" stroke-width="5"><path id="${p}w1" d="M120 105H180V126H215"/><path id="${p}w2" d="M255 126H300V170H212"/><path id="${p}w3" d="M148 170H75V130"/></g>
<circle id="${p}gl" cx="235" cy="85" r="62" fill="#ffe27a" opacity="0"/><circle id="${p}bu" cx="235" cy="85" r="32" fill="#e8f4ff" stroke="#789" stroke-width="3"/><path id="${p}fi" d="M222 105Q228 70 235 85Q242 70 248 105" stroke="#888" stroke-width="3" fill="none"/><rect x="215" y="115" width="40" height="22" rx="4" fill="#333"/><text x="235" y="30" font-size="20" text-anchor="middle" fill="#c98400" font-weight="800">${L}V</text><text id="${p}sm" x="235" y="60" font-size="34" text-anchor="middle" opacity="0">💨</text>
<g class="sw" onclick="tog('${p}')"><rect x="120" y="140" width="110" height="60" fill="transparent"/><circle cx="148" cy="170" r="6" fill="#444"/><circle cx="212" cy="170" r="6" fill="#444"/><line id="${p}lv" x1="148" y1="170" x2="200" y2="140" stroke="#111" stroke-width="7" stroke-linecap="round"/><text x="180" y="196" font-size="13" text-anchor="middle" fill="#1560b0" font-weight="800">القاطع 👆</text></g></svg><div class="cs" id="${p}st">اضغط على القاطع لإغلاق الدارة</div>`}
function tog(p){const s=S[p],g=$('#'+p+'gl'),u=$('#'+p+'bu'),f=$('#'+p+'fi'),lv=$('#'+p+'lv'),ws=['w1','w2','w3'].map(x=>$('#'+p+x));clk();
if(s.on){s.on=0;stopHum();lv.setAttribute('x2',200);lv.setAttribute('y2',140);g.setAttribute('opacity',0);g.classList.remove('glow');u.setAttribute('fill','#e8f4ff');f.setAttribute('stroke','#888');f.setAttribute('d','M222 105Q228 70 235 85Q242 70 248 105');$('#'+p+'sm').setAttribute('opacity',0);ws.forEach(w=>w.classList.remove('flow'));$('#'+p+'st').textContent='القاطع مفتوح: لا يمر التيار';return}
s.on=1;lv.setAttribute('x2',212);lv.setAttribute('y2',166);ws.forEach(w=>w.classList.add('flow'));const r=s.B/s.L;let k,t;
if(r==1){k=0;t='✅ توهج عادي: دلالة البطارية = دلالة المصباح';g.setAttribute('opacity',.55);u.setAttribute('fill','#fff0a0');f.setAttribute('stroke','#f90');setTimeout(()=>hum(.05),150)}
else if(r<1){k=1;t='🔅 توهج ضعيف: دلالة البطارية أصغر من دلالة المصباح';g.setAttribute('opacity',Math.max(.1,r*.35));u.setAttribute('fill','#fbf3cc');f.setAttribute('stroke','#d90');setTimeout(()=>hum(.02),150)}
else if(r<1.5){k=3;t='🔆 توهج أقوى من العادي، والتوتر زائد قليلاً';g.setAttribute('opacity',.8);u.setAttribute('fill','#fff6a0');f.setAttribute('stroke','#f60');setTimeout(()=>hum(.08),150)}
else{k=2;t='🔥 توهج شديد ثم تلف: دلالة البطارية أكبر بكثير من دلالة المصباح';g.setAttribute('opacity',1);g.classList.add('glow');u.setAttribute('fill','#fff');f.setAttribute('stroke','#fff');setTimeout(()=>hum(.12),150);
setTimeout(()=>{if(!s.on)return;burnS();g.classList.remove('glow');g.setAttribute('opacity',0);u.setAttribute('fill','#8a8a8a');f.setAttribute('stroke','#444');f.setAttribute('d','M222 105Q226 85 230 95M240 95Q244 85 248 105');const m=$('#'+p+'sm');m.setAttribute('opacity',1);m.classList.remove('smoke');void m.getBoundingClientRect();m.classList.add('smoke');ws.forEach(w=>w.classList.remove('flow'));$('#'+p+'st').textContent=t+' (اضغط القاطع لتركيب مصباح جديد)';if(p=='lab')res(k)},1500);$('#'+p+'st').textContent='⚡ ...';return}
$('#'+p+'st').textContent=t;if(p=='lab')res(k)}
/* lab */
let LV=6,BV=6,seen=new Set();
function labH(){return `<p>اختر دلالة المصباح ودلالة البطارية ثم أغلق القاطع. اكتشف الحالات الثلاث!</p><div class="lab"><div class="pick"><b>💡 دلالة المصباح:</b>${[3,4.5,6,12].map(v=>`<button class="chip" data-l="${v}" onclick="LV=${v};upd()">${v}V</button>`).join('')}</div><div class="pick"><b>🔋 دلالة البطارية:</b>${[1.5,3,4.5,6,9,12].map(v=>`<button class="chip" data-b="${v}" onclick="BV=${v};upd()">${v}V</button>`).join('')}</div><div class="cw" id="lw"></div><div id="mc"></div><div class="seen"><span id="s0">توهج عادي</span><span id="s1">توهج ضعيف</span><span id="s2">تلف المصباح</span></div><p id="nx"></p><div id="rs"></div></div>`}
function upd(){stopHum();document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',+b.dataset.l==LV));document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on',+b.dataset.b==BV));$('#lw').innerHTML=circ('lab',LV,BV);$('#mc').innerHTML='';[0,1,2].forEach(i=>$('#s'+i).classList.toggle('on',seen.has(i)))}
function res(k){mc(k);if(k!=3){seen.add(k);$('#s'+k).classList.add('on')}
if(seen.size==3&&!done.has(2)){done.add(2);tabs();burst();$('#rs').innerHTML=tbl()+`<p><b>🎉 اكتشفت الحالات الثلاث!</b></p><img class="pic" src="${IM.ok}"><img class="pic" src="${IM.weak}"><img class="pic" src="${IM.burn}">`;$('#nx').innerHTML='<b>أحسنت! ⭐</b>';nv()}}
function tbl(){return `<table class="tb"><tr><th>الحالة</th><th>المقارنة</th><th>النتيجة</th></tr><tr><td>6V مع 6V</td><td>البطارية = المصباح</td><td>توهج عادي</td></tr><tr><td>6V مع 3V</td><td>البطارية &lt; المصباح</td><td>توهج ضعيف</td></tr><tr><td>3V مع 6V</td><td>البطارية &gt;&gt; المصباح</td><td>توهج شديد ثم تلف</td></tr></table><p style="font-size:14px">تنبيه: لا نجري هذه التجربة الحقيقية إلا تحت إشراف الأستاذ.</p>`}
function sumH(){if(!done.has(4)){done.add(4);tabs();burst();good()}return `<p style="font-weight:800;color:var(--ink2)">السنة الأولى متوسط – العلوم الفيزيائية</p><ul><li><b>دلالة المصباح الكهربائي:</b> هي المعلومات التي يكتبها الصانع على المصباح، وتحدد شروط تشغيله العادي.</li><li>تتضمن دلالة المصباح عادةً التوتر الكهربائي الاسمي وشدة التيار الاسمية أو الاستطاعة، حسب ما هو مكتوب عليه.</li><li><b>وحدة قياس التوتر الكهربائي:</b> الفولت، ورمزها <b>V</b>.</li><li><b>وحدة قياس شدة التيار الكهربائي:</b> الأمبير، ورمزها <b>A</b>.</li><li>إذا شُغِّل المصباح بتوتر مناسب لتوتره الاسمي، فإنه يضيء بشكل عادي. أمّا إذا كان التوتر أكبر بكثير من توتره الاسمي، فقد يتلف، وإذا كان أقل فقد يضيء إضاءة ضعيفة.</li></ul><div class="q" style="--c:#e8890c"><b>مثال:</b> إذا كُتب على مصباح <b>3.5V</b>، فهذا يعني أن توتره الاسمي هو <b>3.5 فولط</b>.</div><img class="pic" src="${IM.sum}" alt=""><div class="stars">⭐⭐⭐</div><p style="text-align:center;font:400 26px var(--fd)">بارك الله فيك! أكملت الدرس 🎉</p><p style="text-align:center"><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/channel/UCw6p53L4CuWvG_Y5R9u1DNg?sub_confirmation=1">▶ شاهد المزيد على قناة زينة</a></p>`}
$('#th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';r.dataset.theme=d?'light':'dark'};
$('#mu').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};go(0);
